<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>일본어 독해 실전 문제</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <h1>일본어 독해</h1>
      <p class="sub">최근 제작 순으로 문제 세트 표시</p>
      <nav id="setList" class="set-list" aria-label="문제 세트 목록"></nav>
    </aside>

    <main class="content">
      <header class="content-head">
        <h2 id="setTitle"></h2>
        <p id="setMeta"></p>
      </header>

      <section class="card">
        <h3>지문</h3>
        <div id="passage" class="passage"></div>
      </section>

      <section class="card">
        <h3>문제 1. 다음 내용 중 옳지 않은 것은?</h3>
        <ol id="q1" class="choices"></ol>
      </section>

      <section class="card">
        <h3>문제 2. 지문의 어휘 의미로 가장 적절한 것은?</h3>
        <p id="q2Prompt" class="prompt"></p>
        <ol id="q2" class="choices"></ol>
      </section>

      <section class="card">
        <h3>문제 3. 지문 내용을 응용할 때 가장 타당한 것은?</h3>
        <p id="q3Prompt" class="prompt"></p>
        <blockquote id="q3Linked" class="linked"></blockquote>
        <ol id="q3" class="choices"></ol>
      </section>

      <section class="card">
        <h3>문제 4. 서술형</h3>
        <p id="q4Prompt" class="prompt"></p>
        <textarea id="essay" rows="8" placeholder="여기에 본인의 생각을 일본어 또는 한국어로 작성해 보세요."></textarea>
      </section>

      <section class="card answer">
        <h3>정답 및 해설</h3>
        <div id="solutions"></div>
      </section>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
