<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>日本語読解 実戦問題</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <div class="app">
      <aside class="sidebar">
        <h1>日本語読解</h1>
        <p class="sub">作成日の新しい順で表示</p>
        <nav id="setList" class="set-list" aria-label="問題セット一覧"></nav>
      </aside>

      <main class="content">
        <header class="content-head">
          <h2 id="setTitle"></h2>
          <p id="setMeta"></p>
        </header>

        <section class="card">
          <h3>本文</h3>
          <div id="passage" class="passage"></div>
        </section>

        <div id="questionCards" class="question-cards"></div>

        <section class="card answer">
          <h3>解答・解説</h3>
          <div id="solutions"></div>
        </section>
      </main>
    </div>
  </div>

  <script src="embedded-data.js"></script>
  <script src="script.js"></script>
</body>
</html>
